<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حكايتنا - صاصا وشوشو</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a0a1a;--card:#2b1230;--ink:#fff4f8;--ac:#ff6b9d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;display:flex;justify-content:center;padding:12px}
.app{width:100%;max-width:440px}
.stage{position:relative;height:430px;border-radius:22px;overflow:hidden;background:var(--card)}
.scene{position:absolute;inset:0;opacity:0;transition:opacity .8s;pointer-events:none}
.scene.on{opacity:1}
.date{position:absolute;top:12px;right:14px;background:#0006;padding:3px 12px;border-radius:99px;font-size:13px;font-weight:800;z-index:2}
.chap{position:absolute;top:50px;left:0;right:0;text-align:center;font-size:26px;font-weight:800;opacity:0;z-index:4;text-shadow:0 2px 12px #000a}
.scene.on .chap{animation:chp 2.8s forwards}
.prop{position:absolute;top:48px;left:0;right:0;text-align:center;font-size:56px;animation:fl 3s ease-in-out infinite}
.fx{position:absolute;inset:0;overflow:hidden}
.fx i{position:absolute;top:-30px;font-style:normal;animation:fall linear infinite;opacity:.8}
.ground{position:absolute;bottom:0;left:0;right:0;height:46px;background:#00000030}
.chs{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-around;align-items:flex-end;padding:0 8px}
.cw{position:relative;width:132px}
.ch{width:132px;display:block;animation:sway 3.4s ease-in-out infinite;transform-origin:50% 100%}
.cw.talk .ch{animation:hop .45s ease-in-out infinite}
.cw.talk .m{animation:mo .22s infinite alternate}
.bub{position:absolute;bottom:100%;left:50%;width:176px;transform:translateX(-50%) scale(.6);opacity:0;background:#fff;color:#2b1230;font-weight:800;font-size:14px;line-height:1.5;padding:8px 12px;border-radius:16px;text-align:center;transition:.3s;margin-bottom:-6px;z-index:3}
.bub:after{content:"";position:absolute;top:100%;left:50%;margin-left:-8px;border:8px solid transparent;border-top-color:#fff}
.cw.talk .bub{opacity:1;transform:translateX(-50%) scale(1)}
.hb{position:absolute;bottom:60%;left:50%;font-size:20px;animation:up 1.6s ease-out forwards;pointer-events:none;z-index:3}
.cap{margin-top:12px;background:var(--card);border-radius:16px;padding:14px 16px;font-size:15px;line-height:1.8;min-height:118px}
.bar{height:4px;background:#ffffff22;border-radius:9px;margin-top:12px;overflow:hidden}
.bar b{display:block;height:100%;width:0;background:var(--ac);transition:width .6s}
.ctl{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:10px;flex-wrap:wrap}
.ctl button{background:var(--card);color:var(--ink);border:1px solid #ffffff22;border-radius:99px;padding:8px 16px;font:800 14px Cairo,sans-serif;cursor:pointer}
.ctl button.off{opacity:.45}
.ctl button:focus-visible{outline:2px solid var(--ac)}
.dots{display:flex;gap:6px}.dots span{width:8px;height:8px;border-radius:50%;background:#ffffff33;transition:.3s}.dots .on{background:var(--ac);transform:scale(1.4)}
.ov{position:absolute;inset:0;background:radial-gradient(#4a1648,#1a0a1a);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9;text-align:center;padding:20px}
.ov.on{display:flex}
.ov h1{font-size:34px}.ov p{font-size:15px;opacity:.85}
.ov .big{font-size:60px;animation:fl 2s ease-in-out infinite}
.ov button{background:var(--ac);color:#fff;border:0;border-radius:99px;padding:11px 28px;font:800 17px Cairo,sans-serif;cursor:pointer}
@keyframes hop{50%{transform:translateY(-9px)}}
@keyframes sway{50%{transform:rotate(1.6deg)}}
@keyframes mo{to{transform:scaleY(2.2)}}
@keyframes fl{50%{transform:translateY(-8px)}}
@keyframes fall{to{transform:translateY(480px) rotate(40deg)}}
@keyframes up{to{transform:translateY(-110px) scale(1.4);opacity:0}}
@keyframes chp{0%{opacity:0;transform:translateY(10px)}15%,75%{opacity:1;transform:none}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.ch,.cw.talk .ch,.prop,.fx i,.ov .big{animation:none}}
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <div class="ov on" id="start"><div class="big">🎬</div><h1>صاصا ❤️ شهد</h1><p>فيلم كرتون بيحكي حكايتنا<br>(شغّلي الصوت وإنتي بتتفرجي)</p><button id="go">ابدأ الحكاية</button></div>
    <div class="ov" id="end"><div class="big">💍</div><h1>والحكاية مكملة...</h1><p>الحب مش بس كلمة، الحب إنك تلاقي حد يستاهل تضحي عشانه كل يوم ❤️</p><button id="again">شوفيها تاني</button></div>
  </div>
  <div class="cap" id="cap"></div>
  <div class="bar"><b id="pb"></b></div>
  <div class="ctl"><button id="prev">السابق</button><button id="pp">إيقاف</button><button id="next">التالي</button></div>
  <div class="ctl"><button id="tv">🗣️ الأصوات</button><button id="tm">🎵 الموسيقى</button></div>
  <div class="ctl"><div class="dots" id="dots"></div></div>
</div>
<script>
// ===== عدّل القصة من هنا =====
var SC=[
{t:"الفصل الأول: مزّة جامدة",bg:"linear-gradient(#3b2a6b,#6b3a7a)",prop:"💻",fx:"💗",date:"البداية",
 cap:"في يوم من الأيام، في سنة من السنين، في ساعة من الساعات، طلّت علينا مزّة جامدة اسمها شهد. دخلت تبعت للواد الحلو صاصا تسأله إزاي تترجم موقع الجامعة، وهو ساعدها علشان هي غلبانة... ومن هنا بدأت تقع في حبه.",
 lines:[["g","ممكن تساعدني أترجم موقع الجامعة؟ 🥺"],["b","عيني ليكي، ثواني وتبقى تمام 😎"],["g","شكراً أوي... أنت جدع 💕"],["b","دي حاجة بسيطة، أي وقت 🙈"]]},
{t:"الفصل الثاني: الاعتراف",bg:"linear-gradient(#0d1b3d,#2a2060)",prop:"🌙",fx:"✨",date:"14 ديسمبر 2023",
 cap:"بعد ما بدأت تقع في حبه، الكل استغرب وسألها، وهي تقول: ده عادي. لكن في ليالي الشتاء الباردة، عند الساعة الثانية عشرة منتصف الليل، اعترفوا لبعض بحبهم وغيرتهم... ومن هنا بدأت الرواية.",
 lines:[["b","شهد... في حاجة عايز أقولهالك 🥺"],["g","قول، أنا سامعاكي... أقصد سامعاك 😅"],["b","أنا بحبك، وبغير عليكي كمان ❤️"],["g","وأنا كمان بحبك أوي 🥰"],["b","كده بدأت الحكاية 🌟"]]},
{t:"الفصل الثالث: الخناق والغيرة",bg:"linear-gradient(#5a1a2a,#8a2a3a)",prop:"💢👗",fx:"💥",date:"الأيام الأولى",
 cap:"بدأت قصة الحب والخناق والغيرة، وحوارات اللبس اللي ما بتخلصش أبداً. بس مهما اتخانقوا، كانوا بيرجعوا لبعض في الآخر.",
 lines:[["b","إنتي هتلبسي ده؟ 😤"],["g","آه، ومالو؟ 😒"],["b","مفيش... بس بغير 🙈"],["g","يا ساتر عليك 😂 تعالى نصالح"],["b","ماشي، حقك عليا ❤️"]]},
{t:"الفصل الرابع: سهرة الأفلام",bg:"linear-gradient(#4a1633,#7a2a4a)",prop:"🎬🍿",fx:"💞",date:"50+ فيلم",
 cap:"وبعد مدة من بداية القصة، مصطفى بدأ يشاركها أفلامه ومسلسلاته علشان يتفرجوا عليها سوا. وبقى عندهم أكتر من خمسين فيلم اتفرجوا عليهم مع بعض.",
 lines:[["b","الفيلم ده لازم تشوفيه، هتحبيه 🍿"],["g","طب بشرط تفضل جنبي طول الفيلم 🥺"],["b","وهو في أحلى من كده؟ 😍"],["g","ده أحلى فيلم، لأنك معايا ❤️"]]},
{t:"الفصل الخامس: أول عيد حب",bg:"linear-gradient(#5a1038,#c0407a)",prop:"🌹💌",fx:"❤️",date:"14 فبراير 2024",
 cap:"جه أول عيد حب ليهم، 14 فبراير 2024. يوم الورد والكلام الحلو، واللي عرفوا فيه إن الحكاية دي مش عادية.",
 lines:[["b","كل سنة وإنتي طيبة يا حبيبتي 🌹"],["g","وإنت طيب يا أحلى حاجة في حياتي 🥰"],["b","ده أول عيد حب، وإن شاء الله مش آخر واحد 💕"]]},
{t:"الفصل السادس: رحلة المذاكرة",bg:"linear-gradient(#17394a,#2a6a7a)",prop:"📚✏️",fx:"⭐",date:"أيام الجامعة",
 cap:"بعد كده بدأوا رحلة المذاكرة سوا. مصطفى بيساعد شهد تفهم المحاضرات وتذاكرها، علشان تتفوق في دراستها وتفرّح أهلها وتفرّحه.",
 lines:[["g","أنا مش فاهمة المحاضرة دي خالص 😭"],["b","اهدي، تعالي أشرحهالك من الأول 📖"],["g","أنت شرحك أحلى من الدكتور 😂"],["b","وإنتي هتتفوقي، أنا واثق فيكي 💪"]]},
{t:"الفصل السابع: هدية رامبو",bg:"linear-gradient(#3a2a6b,#7a4a9a)",prop:"🧸🎁",fx:"🎈",date:"17 مارس 2024",
 cap:"وفي أول عيد ميلاد لها، يوم 17 مارس 2024، جابلها مصطفى هدية: دبدوب على شكل رامبو. وهي فرحت بيه جداً، وبقى معاها في كل مكان.",
 lines:[["b","كل سنة وإنتي طيبة يا شهد 🎂"],["b","دي هديتك... حاجة صغيرة من قلب كبير 🎁"],["g","رامبو؟! حلو أوي، شكراً يا قلبي 🧸❤️"]]},
{t:"الفصل الثامن: أول خروجة",bg:"linear-gradient(#5a2a14,#c07a3a)",prop:"🎂🌹",fx:"🎉",date:"28 أبريل 2024",
 cap:"وجه عيد ميلاد مصطفى يوم 24 أبريل 2024، بس احتفلوا بيه متأخر، لأن أول خروجة ليهم سوا كانت يوم 28 أبريل. ومن يومها، استمرت الحكاية مبنية على الثقة والغيرة والحب والمشاعر المشتركة.",
 lines:[["g","كل سنة وإنت طيب يا صاصا 🎂"],["b","أحلى عيد ميلاد، علشان إنتي معايا 🥰"],["g","ده أول يوم نخرج فيه سوا 🌹"],["b","ومش هيبقى آخر يوم أبداً ❤️"]]},
{t:"الفصل الأخير: وللأبد",bg:"linear-gradient(#2a0a3a,#7a1a5a)",prop:"💍♾️",fx:"💖",date:"دايماً وأبداً",
 cap:"ومن يومها وهما مع بعض: أكتر من مية خروجة، وضحك ما بيخلصش، وحب كل يوم بيكبر. وأحلى ما في الحكاية إنها لسه في أولها.",
 lines:[["b","أنا مش محتاج مناسبة علشان أقولك بحبك ❤️"],["g","وأنا كل يوم معاك بقى مناسبة 🥹"],["b","نفضل مع بعض لآخر العمر؟ 💍"],["g","لآخر العمر... وبعده كمان 💖"]]}
];
// ============================
function boy(){return '<svg class="ch" viewBox="0 0 100 150"><rect x="20" y="92" width="60" height="56" rx="20" fill="#4a7bd0"/><circle cx="50" cy="54" r="33" fill="#f6cfa5"/><path d="M16 50Q18 12 50 14Q82 12 84 50Q68 30 50 35Q32 30 16 50Z" fill="#2b1b17"/><circle cx="38" cy="56" r="4" fill="#222"/><circle cx="62" cy="56" r="4" fill="#222"/><circle cx="30" cy="66" r="5" fill="#f4a0a0" opacity=".6"/><circle cx="70" cy="66" r="5" fill="#f4a0a0" opacity=".6"/><ellipse class="m" cx="50" cy="71" rx="7" ry="3" fill="#b3342f" style="transform-origin:50px 71px"/></svg>'}
function girl(){return '<svg class="ch" viewBox="0 0 100 150"><path d="M12 62Q10 10 50 12Q90 10 88 62L92 124Q50 134 8 124Z" fill="#5a3322"/><rect x="20" y="92" width="60" height="56" rx="20" fill="#e85d9a"/><circle cx="50" cy="54" r="31" fill="#f8d5b0"/><path d="M19 52Q22 20 50 20Q78 20 81 52Q64 36 50 40Q36 36 19 52Z" fill="#5a3322"/><circle cx="38" cy="56" r="4" fill="#222"/><circle cx="62" cy="56" r="4" fill="#222"/><circle cx="30" cy="66" r="5" fill="#f4a0a0" opacity=".7"/><circle cx="70" cy="66" r="5" fill="#f4a0a0" opacity=".7"/><ellipse class="m" cx="50" cy="71" rx="6" ry="3" fill="#c0455a" style="transform-origin:50px 71px"/><path d="M62 18l12-8v16zM62 18L50 10v16z" fill="#ff8fb8"/></svg>'}
var $=function(i){return document.getElementById(i)};
var stage=$("stage"),cap=$("cap"),pb=$("pb"),dots=$("dots"),pp=$("pp"),startEl=$("start"),endEl=$("end");
var els=[],si=0,li=0,timer=null,paused=false,tok=0,voiceOn=true,musicOn=true,ctx=null,curAudio=null;
var mus=new Audio("tamally-maak.mp3");mus.loop=true;mus.volume=.16;
SC.forEach(function(s){
  var d=document.createElement("div");d.className="scene";d.style.background=s.bg;
  var fx="";for(var k=0;k<14;k++)fx+='<i style="left:'+(k*7+Math.random()*4)+'%;font-size:'+(12+Math.random()*12)+'px;animation-duration:'+(5+Math.random()*5)+'s;animation-delay:-'+(Math.random()*8)+'s">'+s.fx+'</i>';
  d.innerHTML='<div class="fx">'+fx+'</div><div class="date">'+s.date+'</div><div class="chap">'+s.t+'</div><div class="prop">'+s.prop+'</div><div class="ground"></div><div class="chs"><div class="cw" data-w="g">'+girl()+'<div class="bub"></div></div><div class="cw" data-w="b">'+boy()+'<div class="bub"></div></div></div>';
  stage.insertBefore(d,startEl);els.push(d);dots.appendChild(document.createElement("span"));
});
function sfx(f,d,t){if(!ctx)return;try{var o=ctx.createOscillator(),g=ctx.createGain();o.type=t||"sine";o.frequency.value=f;g.gain.value=.07;g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}catch(e){}}
function chime(){[660,880,1100,1320].forEach(function(f,i){setTimeout(function(){sfx(f,.45)},i*120)})}
function burst(c){for(var i=0;i<5;i++){var h=document.createElement("span");h.className="hb";h.textContent=["❤️","💕","💗"][i%3];h.style.marginLeft=(i*18-36)+"px";h.style.animationDelay=(i*.12)+"s";c.appendChild(h);setTimeout(function(x){x.remove()},2200,h)}}
function stopAll(){tok++;clearTimeout(timer);if(window.speechSynthesis)speechSynthesis.cancel();if(curAudio){curAudio.onended=curAudio.onerror=null;curAudio.pause();curAudio=null}}
function speak(text,w,fin){
  if(!window.speechSynthesis||!window.SpeechSynthesisUtterance)return false;
  var u=new SpeechSynthesisUtterance(text.replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{FE0F}\u{2661}-\u{2665}]/gu,""));
  u.lang="ar-EG";var vs=speechSynthesis.getVoices();
  var v=vs.filter(function(x){return /^ar/i.test(x.lang)})[0];if(v){u.voice=v;u.lang=v.lang}
  u.pitch=w==="g"?1.55:.8;u.rate=.95;u.onend=fin;u.onerror=fin;speechSynthesis.speak(u);return true;
}
function say(w,text,n,fin){
  var done=false,f=function(){if(!done){done=true;fin()}};
  setTimeout(f,11000);
  if(!voiceOn){setTimeout(f,2800);return}
  var fb=function(){if(!speak(text,w,f))setTimeout(f,2800)};
  var a=new Audio("audio/"+(si+1)+"-"+n+".mp3");curAudio=a;a.onerror=fb;a.onended=f;
  var p=a.play();if(p&&p.catch)p.catch(fb);
}
function show(i){
  stopAll();si=i;li=0;endEl.classList.remove("on");startEl.classList.remove("on");
  els.forEach(function(e,k){e.classList.toggle("on",k===i)});
  [].forEach.call(dots.children,function(d,k){d.className=k===i?"on":""});
  cap.textContent=SC[i].cap;pb.style.width=((i+1)/SC.length*100)+"%";
  [].forEach.call(els[i].querySelectorAll(".cw"),function(c){c.classList.remove("talk")});
  chime();var t=tok;timer=setTimeout(function(){line(t)},2200);
}
function line(t){
  if(t!==tok||paused)return;
  var L=SC[si].lines,sc=els[si];
  [].forEach.call(sc.querySelectorAll(".cw"),function(c){c.classList.remove("talk")});
  if(li>=L.length){timer=setTimeout(function(){if(t!==tok)return;si<SC.length-1?show(si+1):(stopAll(),endEl.classList.add("on"),chime())},1500);return}
  var w=L[li][0],txt=L[li][1],n=li+1,c=sc.querySelector('.cw[data-w="'+w+'"]');
  c.querySelector(".bub").textContent=txt;c.classList.add("talk");sfx(w==="g"?920:520,.12,"triangle");
  if(/[❤💕🥰💖💍]/.test(txt))burst(c);
  li++;say(w,txt,n,function(){if(t!==tok)return;timer=setTimeout(function(){line(t)},500)});
}
$("go").onclick=function(){try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}if(musicOn){var p=mus.play();if(p&&p.catch)p.catch(function(){})}show(0)};
$("next").onclick=function(){show(Math.min(si+1,SC.length-1))};
$("prev").onclick=function(){show(Math.max(si-1,0))};
$("again").onclick=function(){show(0)};
pp.onclick=function(){paused=!paused;pp.textContent=paused?"تشغيل":"إيقاف";if(paused){stopAll()}else{li=Math.max(li-1,0);var t=tok;timer=setTimeout(function(){line(t)},300)}};
$("tv").onclick=function(){voiceOn=!voiceOn;this.className=voiceOn?"":"off";if(!voiceOn&&window.speechSynthesis)speechSynthesis.cancel()};
$("tm").onclick=function(){musicOn=!musicOn;this.className=musicOn?"":"off";if(musicOn){var p=mus.play();if(p&&p.catch)p.catch(function(){})}else mus.pause()};
cap.textContent="اضغطي «ابدأ الحكاية» 🎬";
</script>
</body>
</html>
